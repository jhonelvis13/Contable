<!-- src/app/modules/socios/socio-form-modal.component.html -->
<div *ngIf="isVisible" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
  <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white">
    <!-- Header del modal -->
    <div class="flex items-center justify-between pb-3 border-b">
      <h3 class="text-lg font-semibold text-gray-900">
        {{ isEditMode ? 'Editar Socio' : 'Nuevo Socio' }}
      </h3>
      <button
        type="button"
        (click)="onClose()"
        class="text-gray-400 hover:text-gray-600 focus:outline-none">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>

    <!-- Formulario -->
    <form [formGroup]="socioForm" (ngSubmit)="onSubmit()" class="mt-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Nombre -->
        <div class="col-span-1 md:col-span-2">
          <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">
            Nombre Completo *
          </label>
          <input
            type="text"
            id="nombre"
            formControlName="nombre"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            [class.border-red-500]="hasError('nombre', 'required') || hasError('nombre', 'minlength')"
            placeholder="Ingrese el nombre completo">
          <div *ngIf="getErrorMessage('nombre')" class="text-red-500 text-sm mt-1">
            {{ getErrorMessage('nombre') }}
          </div>
        </div>

        <!-- CI/NIT -->
        <div>
          <label for="ciNit" class="block text-sm font-medium text-gray-700 mb-1">
            CI/NIT
          </label>
          <input
            type="text"
            id="ciNit"
            formControlName="ciNit"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Ej: 1234567 LP">
        </div>

        <!-- Teléfono -->
        <div>
          <label for="telefono" class="block text-sm font-medium text-gray-700 mb-1">
            Teléfono
          </label>
          <input
            type="text"
            id="telefono"
            formControlName="telefono"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Ej: 71234567">
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
            Email
          </label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            [class.border-red-500]="hasError('email', 'email')"
            placeholder="ejemplo@correo.com">
          <div *ngIf="getErrorMessage('email')" class="text-red-500 text-sm mt-1">
            {{ getErrorMessage('email') }}
          </div>
        </div>

        <!-- Porcentaje de Participación -->
        <div>
          <label for="porcentajeParticipacion" class="block text-sm font-medium text-gray-700 mb-1">
            Porcentaje de Participación (%) *
          </label>
          <input
            type="number"
            id="porcentajeParticipacion"
            formControlName="porcentajeParticipacion"
            min="0"
            max="100"
            step="0.01"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            [class.border-red-500]="hasError('porcentajeParticipacion', 'required') || hasError('porcentajeParticipacion', 'min') || hasError('porcentajeParticipacion', 'max')"
            placeholder="0.00">
          <div *ngIf="getErrorMessage('porcentajeParticipacion')" class="text-red-500 text-sm mt-1">
            {{ getErrorMessage('porcentajeParticipacion') }}
          </div>
        </div>

        <!-- Dirección -->
        <div class="col-span-1 md:col-span-2">
          <label for="direccion" class="block text-sm font-medium text-gray-700 mb-1">
            Dirección
          </label>
          <textarea
            id="direccion"
            formControlName="direccion"
            rows="2"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            placeholder="Ingrese la dirección completa"></textarea>
        </div>

        <!-- Estado Activo -->
        <div class="col-span-1 md:col-span-2 flex items-center">
          <input
            type="checkbox"
            id="activo"
            formControlName="activo"
            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
          <label for="activo" class="ml-2 block text-sm text-gray-700">
            Socio activo
          </label>
        </div>
      </div>

      <!-- Botones del modal -->
      <div class="flex items-center justify-end pt-6 border-t mt-6 space-x-2">
        <button
          type="button"
          (click)="onClose()"
          class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors"
          [disabled]="isLoading">
          Cancelar
        </button>
        
        <button
          type="submit"
          class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
          [disabled]="!socioForm.valid || isLoading">
          <div *ngIf="isLoading" class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
          {{ isLoading ? 'Guardando...' : (isEditMode ? 'Actualizar' : 'Crear') }}
        </button>
      </div>
    </form>
  </div>
</div>
