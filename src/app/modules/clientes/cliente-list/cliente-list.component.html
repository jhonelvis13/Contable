
<div class="p-6">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Clientes</h1>
    <button
      (click)="openNewClienteModal()"
      class="bg-black text-white px-4 py-2 rounded-2xl hover:bg-gray-800 transition-all duration-300"
    >
      + Nuevo Cliente
    </button>
  </div>

  <!-- Filters -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div>
      <label class="text-sm text-gray-600 mb-1 block">Tipo</label>
      <select
        [value]="tipoFilter"
        (change)="onTipoFilterChange($event)"
        class="w-full p-2 rounded-2xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400"
      >
        <option value="">Todos</option>
        <option value="Empresa">Empresa</option>
        <option value="Particular">Particular</option>
      </select>
    </div>

    <div>
      <label class="text-sm text-gray-600 mb-1 block">Estado</label>
      <select
        [value]="activoFilter"
        (change)="onActivoFilterChange($event)"
        class="w-full p-2 rounded-2xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400"
      >
        <option value="">Todos</option>
        <option value="Activo">Activo</option>
        <option value="Inactivo">Inactivo</option>
      </select>
    </div>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-2xl shadow-md p-6">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">NIT</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tipo</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Teléfono</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let cliente of filteredClientes" class="hover:bg-gray-50 cursor-pointer" (click)="viewDetalle(cliente)">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ cliente.nombre }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ cliente.nit }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ cliente.tipo }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ cliente.telefono }}</td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                    [class]="cliente.activo ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
                {{ cliente.activo ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
              <button (click)="viewDetalle(cliente); $event.stopPropagation()" 
                      class="text-blue-600 hover:text-blue-900 mr-4">Ver</button>
              <button (click)="editCliente(cliente, $event)" 
                      class="text-indigo-600 hover:text-indigo-900 mr-4">Editar</button>
              <button (click)="deleteCliente(cliente, $event)" 
                      class="text-red-600 hover:text-red-900">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal de Cliente -->
<app-cliente-form-modal
  [data]="selectedCliente"
  [isVisible]="showModal"
  [editMode]="!!selectedCliente"
  (closeModal)="closeModal()"
  (saveData)="onClienteGuardado($event)">
</app-cliente-form-modal>
