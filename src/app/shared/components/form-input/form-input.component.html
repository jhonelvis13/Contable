<!-- src/app/shared/components/form-input/form-input.component.html -->
<div class="flex flex-col">
  <label class="text-sm text-gray-600 mb-1">{{ label }}</label>
  <input
    [type]="type"
    [value]="value"
    [disabled]="disabled"
    [placeholder]="placeholder"
    (input)="onInputChange($event)"
    class="p-2 rounded-2xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 disabled:bg-gray-100 disabled:cursor-not-allowed"
  >
</div>
