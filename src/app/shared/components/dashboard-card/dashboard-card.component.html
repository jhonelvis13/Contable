<div class="bg-white p-6 rounded-2xl shadow-md flex flex-col justify-between h-full">
  <div class="flex items-center justify-between mb-4">
    <h3 class="text-lg font-semibold text-gray-600">{{ title }}</h3>
    <div class="bg-gray-100 p-2 rounded-lg">
      <i class="text-gray-500 text-xl" [class]="icon"></i>
    </div>
  </div>
  <div>
    <p class="text-3xl font-bold text-gray-800">{{ value }}</p>
    <p class="text-sm text-gray-500 mt-1">{{ detail }}</p>
  </div>
</div>
