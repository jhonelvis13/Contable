<!-- src/app/shared/components/data-table/data-table.component.html -->
<div class="w-full">
  <!-- Search Bar -->
  <div *ngIf="searchable" class="mb-4">
    <input
      type="text"
      placeholder="Buscar..."
      (input)="onSearch($any($event.target).value)"
      class="w-full md:w-1/3 p-2 rounded-2xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400"
    />
  </div>

  <!-- Table -->
  <div class="overflow-x-auto rounded-2xl border border-gray-200">
    <table class="w-full text-left text-gray-700">
      <thead>
        <tr class="bg-gray-100">
          <th
            *ngFor="let col of columns"
            (click)="onSort(col)"
            [class.cursor-pointer]="col.sortable"
            class="p-4 font-semibold"
          >
            <div class="flex items-center gap-2">
              <span>{{ col.label }}</span>
              <span *ngIf="col.sortable && sortColumn === col.key" class="text-xs">
                {{ sortDirection === 'asc' ? '▲' : '▼' }}
              </span>
            </div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let item of paginatedData"
          (click)="onRowClick(item)"
          class="border-b hover:bg-gray-50 transition-all duration-300 cursor-pointer"
        >
          <td *ngFor="let col of columns" class="p-4">
            <ng-container *ngIf="col.key !== 'actions'; else actionsTemplate">
              {{ item[col.key] }}
            </ng-container>
            <ng-template #actionsTemplate>
              <ng-content select="[actions]"></ng-content>
            </ng-template>
          </td>
        </tr>
        <tr *ngIf="paginatedData.length === 0">
          <td [attr.colspan]="columns.length" class="p-8 text-center text-gray-500">
            No se encontraron resultados
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div *ngIf="showPagination && totalPages > 1" class="flex justify-between items-center mt-4">
    <div class="text-sm text-gray-600">
      Mostrando {{ (currentPage - 1) * pageSize + 1 }} - {{ rangeEnd }} de {{ filteredData.length }}
    </div>
    <div class="flex gap-2">
      <button
        (click)="previousPage()"
        [disabled]="currentPage === 1"
        class="px-3 py-1 rounded-xl border border-gray-300 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300"
      >
        Anterior
      </button>
      <button
        *ngFor="let page of pages"
        (click)="goToPage(page)"
        [class.bg-black]="page === currentPage"
        [class.text-white]="page === currentPage"
        class="px-3 py-1 rounded-xl border border-gray-300 hover:bg-gray-100 transition-all duration-300"
      >
        {{ page }}
      </button>
      <button
        (click)="nextPage()"
        [disabled]="currentPage === totalPages"
        class="px-3 py-1 rounded-xl border border-gray-300 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300"
      >
        Siguiente
      </button>
    </div>
  </div>
</div>
